name: Feature request
description: Propose a safe, provider-neutral improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: What recurring agent-engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Proposed experience
      description: Describe the screen behavior, physical control, and evidence shown to the operator.
    validations:
      required: true
  - type: checkboxes
    id: authority
    attributes:
      label: Authority boundary
      options:
        - label: The proposal does not add a one-press push, merge, deploy, delete, spend, credential, or permission-approval action.
          required: true

