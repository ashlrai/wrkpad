name: Package preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned macOS preview
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - name: Preserve executable bits
        run: tar -C release -czf ashlr-agent-board-macos-unsigned.tgz .
      - name: Upload unsigned preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ashlr-agent-board-macos-unsigned
          path: ashlr-agent-board-macos-unsigned.tgz
          if-no-files-found: error
          retention-days: 14

