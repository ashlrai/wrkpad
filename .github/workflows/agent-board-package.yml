name: Agent Board unsigned package audit

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  package:
    name: Verify unsigned macOS package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - name: Verify bundle metadata and expected unsigned state
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find release -type d -name 'Ashlr Agent Board.app' -print -quit)"
          test -n "$bundle"
          node scripts/verify-packaged-requires.cjs "$bundle/Contents/Resources/app.asar"
          plist="$bundle/Contents/Info.plist"
          executable="$bundle/Contents/MacOS/Ashlr Agent Board"
          expected_version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "ai.ashlr.agent-board"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$expected_version"
          architectures="$(lipo -archs "$executable")"
          [[ "$architectures" =~ ^(arm64|x86_64)(\ (arm64|x86_64))*$ ]]
          signature_info="$(codesign -dvvv "$bundle" 2>&1 || true)"
          if grep -q '^Authority=Developer ID Application:' <<<"$signature_info"; then
            echo "Audit package unexpectedly contains a Developer ID Application authority." >&2
            exit 1
          fi
          team_id="$(sed -n 's/^TeamIdentifier=//p' <<<"$signature_info" | head -1)"
          if [[ -n "$team_id" && "$team_id" != "not set" ]]; then
            echo "Audit package unexpectedly contains a signing team identifier." >&2
            exit 1
          fi
          if ! { grep -q '^Signature=adhoc$' <<<"$signature_info" && grep -q '^TeamIdentifier=not set$' <<<"$signature_info"; } \
            && ! grep -q 'code object is not signed at all' <<<"$signature_info"; then
            echo "Audit package signature state was empty or unrecognized; refusing to classify it as expected-unsigned." >&2
            exit 1
          fi
          if spctl --assess --type execute "$bundle" >/dev/null 2>&1; then
            echo "Expected Gatekeeper to reject the non-distribution audit package." >&2
            exit 1
          fi
          checksum="$(shasum -a 256 "$bundle/Contents/Resources/app.asar" | awk '{print $1}')"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          {
            printf 'bundle_id=ai.ashlr.agent-board\n'
            printf 'version=%s\n' "$expected_version"
            printf 'architectures=%s\n' "$architectures"
            printf 'app_asar_sha256=%s\n' "$checksum"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'developer_id_signed=false\n'
            printf 'notarized=false\n'
            printf 'published=false\n'
          } | tee "$RUNNER_TEMP/ashlr-agent-board-unsigned-audit.manifest.txt"
      - name: Record non-distribution boundary
        run: |
          {
            echo '### Unsigned package audit'
            echo ''
            echo 'The package was built and inspected on this ephemeral runner.'
            echo 'No application archive or installable binary was uploaded or published.'
          } >> "$GITHUB_STEP_SUMMARY"
