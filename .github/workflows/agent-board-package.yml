name: Agent Board unsigned preview

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  package:
    name: Build unsigned macOS preview
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
      - name: Preserve executable bits
        run: tar -czf ashlr-agent-board-macos-unsigned.tgz -C release .
      - name: Write source and checksum manifest
        shell: bash
        run: |
          archive="ashlr-agent-board-macos-unsigned.tgz"
          checksum="$(shasum -a 256 "$archive" | awk '{print $1}')"
          {
            printf 'artifact=%s\n' "$archive"
            printf 'sha256=%s\n' "$checksum"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'signed=false\n'
            printf 'notarized=false\n'
          } > ashlr-agent-board-macos-unsigned.manifest.txt
      - name: Upload explicitly unsigned preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ashlr-agent-board-macos-unsigned
          path: |
            app/ashlr-agent-board-macos-unsigned.tgz
            app/ashlr-agent-board-macos-unsigned.manifest.txt
          if-no-files-found: error
          retention-days: 14
