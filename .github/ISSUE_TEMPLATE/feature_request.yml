name: Feature request
description: Propose a safe, provider-neutral improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - wrkpad core
        - Agent Board desktop app
        - Hardware interoperability
        - Cross-component workflow
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: What recurring agent-engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed experience and evidence
      description: Describe the visible behavior, physical control if any, authority boundary, and acceptance evidence.
    validations:
      required: true
  - type: checkboxes
    id: authority
    attributes:
      label: Authority boundary
      options:
        - label: The proposal does not add a one-press push, merge, deploy, delete, spend, credential, or permission-approval action.
          required: true

