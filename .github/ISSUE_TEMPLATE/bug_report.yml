name: Bug report
description: Report a reproducible wrkpad or Agent Board problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I did not include prompts, transcripts, credentials, tokens, serial numbers, or private repository data.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - wrkpad CLI, TUI, HASP, hooks, or service
        - Agent Board desktop app
        - Creator Micro 2 discovery or Flight Check
        - Documentation or packaging
        - Unsure
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include exact steps, expected behavior, actual behavior, and the evidence layer involved.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, commit or version, firmware if relevant, and redacted doctor output.
    validations:
      required: true
  - type: dropdown
    id: board_route
    attributes:
      label: Declared board route
      description: Choose the route you were actually testing; they have different owners and acceptance gates.
      options:
        - Not a hardware issue
        - Ashlr Layer (shared Codex and Claude shortcuts)
        - Codex Native (exclusive native protocol)
        - Unknown or not selected
    validations:
      required: true
  - type: textarea
    id: hardware_evidence
    attributes:
      label: Hardware evidence
      description: If relevant, include redacted preflight/doctor reason codes, Input version, firmware version, and whether USB discovery, provider receipt, and physical Flight Check passed separately.
