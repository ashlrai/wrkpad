name: Bug report
description: Report a reproducible wrkpad or Agent Board problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I did not include prompts, transcripts, credentials, tokens, serial numbers, or private repository data.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - wrkpad CLI, TUI, HASP, hooks, or service
        - Agent Board desktop app
        - Creator Micro 2 discovery or Flight Check
        - Documentation or packaging
        - Unsure
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include exact steps, expected behavior, actual behavior, and the evidence layer involved.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, commit or version, firmware if relevant, and redacted doctor output.
    validations:
      required: true
